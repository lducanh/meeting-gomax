# Mỗi lần đẩy code lên main, tự upload lên hosting qua FTP.
# Cần khai báo 4 secret trong GitHub (Settings → Secrets and variables → Actions):
# FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_DIR (ví dụ: public_html/lich-hop/ — phải kết thúc bằng dấu /).
# config.php và data/meetings.json không nằm trong git nên không bao giờ bị ghi đè trên hosting.
name: Deploy lên hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4
      - name: Bỏ qua khi chưa khai báo secret FTP
        if: env.FTP_SERVER == ''
        run: echo "Chưa có secret FTP_SERVER nên không deploy."
      - name: Upload qua FTP
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR }}
          protocol: ftps
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            data/**
